<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NstructR</title>
<meta name="theme-color" content="#0e2648">
<script>/* the theme chosen in Settings, applied before anything is drawn */
try { const t = localStorage.getItem('nstructr-theme-v1'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { }</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* ===== Material 3 color tokens (tonal spot, seed #216CAD: the blue in the app icon) ===== */
:root{
  --md-primary:#36618e;--md-on-primary:#ffffff;--md-primary-container:#d1e4ff;--md-on-primary-container:#194975;
  --md-secondary:#535f70;--md-secondary-container:#d7e3f7;--md-on-secondary-container:#3b4858;--md-tertiary:#6b5778;--md-tertiary-container:#f2daff;--md-on-tertiary-container:#523f5f;
  --md-surface:#f8f9ff;--md-surface-container-lowest:#ffffff;--md-surface-container-low:#f2f3fa;--md-surface-container:#eceef4;--md-surface-container-high:#e6e8ee;--md-surface-container-highest:#e1e2e8;
  --md-on-surface:#191c20;--md-on-surface-variant:#43474e;--md-outline:#73777f;--md-outline-variant:#c3c7cf;--md-inverse-surface:#2e3135;--md-inverse-on-surface:#eff0f7;--md-inverse-primary:#a0cafd;--md-error:#ba1a1a;
  --md-scrim:rgba(0,0,0,.32);
  --tape:#c9a227;--band:#d4453a;--towel:#b08968;--weight:#4f555c;
  --shape-s:8px;--shape-m:12px;--shape-l:16px;--shape-xl:28px;--shape-full:999px;
  --elev-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --ease-emph:cubic-bezier(.2,0,0,1);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --md-primary:#a0cafd;--md-on-primary:#003258;--md-primary-container:#194975;--md-on-primary-container:#d1e4ff;
  --md-secondary:#bbc7db;--md-secondary-container:#3b4858;--md-on-secondary-container:#d7e3f7;--md-tertiary:#d6bee4;--md-tertiary-container:#523f5f;--md-on-tertiary-container:#f2daff;
  --md-surface:#111418;--md-surface-container-lowest:#0b0e13;--md-surface-container-low:#191c20;--md-surface-container:#1d2024;--md-surface-container-high:#272a2f;--md-surface-container-highest:#32353a;
  --md-on-surface:#e1e2e8;--md-on-surface-variant:#c3c7cf;--md-outline:#8d9199;--md-outline-variant:#43474e;--md-inverse-surface:#e1e2e8;--md-inverse-on-surface:#2e3135;--md-inverse-primary:#36618e;--md-error:#ffb4ab;
  --tape:#d9b441;--band:#ff8a7a;--towel:#d9b98f;--weight:#aab2ba;color-scheme:dark;}}
:root[data-theme="dark"]{
  --md-primary:#a0cafd;--md-on-primary:#003258;--md-primary-container:#194975;--md-on-primary-container:#d1e4ff;
  --md-secondary:#bbc7db;--md-secondary-container:#3b4858;--md-on-secondary-container:#d7e3f7;--md-tertiary:#d6bee4;--md-tertiary-container:#523f5f;--md-on-tertiary-container:#f2daff;
  --md-surface:#111418;--md-surface-container-lowest:#0b0e13;--md-surface-container-low:#191c20;--md-surface-container:#1d2024;--md-surface-container-high:#272a2f;--md-surface-container-highest:#32353a;
  --md-on-surface:#e1e2e8;--md-on-surface-variant:#c3c7cf;--md-outline:#8d9199;--md-outline-variant:#43474e;--md-inverse-surface:#e1e2e8;--md-inverse-on-surface:#2e3135;--md-inverse-primary:#36618e;--md-error:#ffb4ab;
  --tape:#d9b441;--band:#ff8a7a;--towel:#d9b98f;--weight:#aab2ba;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--md-surface);color:var(--md-on-surface);
  font-family:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:20px;letter-spacing:.25px;
  -webkit-font-smoothing:antialiased}
.icon{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;
  text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;width:1em;overflow:hidden;flex:none;user-select:none}
.icon.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}

/* ===== Type scale ===== */
.title-large{font-size:22px;line-height:28px;font-weight:400;letter-spacing:0}
.headline-small{font-size:24px;line-height:32px;font-weight:400;letter-spacing:0;margin:0}
.title-medium{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;margin:0}
.title-small{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;margin:0}
.body-large{font-size:16px;line-height:24px;letter-spacing:.5px}
.body-small{font-size:12px;line-height:16px;letter-spacing:.4px}
.label-large{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.muted{color:var(--md-on-surface-variant)}

/* ===== State layers ===== */
.stateful{position:relative;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stateful::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s linear;pointer-events:none;border-radius:inherit}
.stateful:hover::before{opacity:.08}.stateful:active::before{opacity:.12}
:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.38}
button:disabled::before{display:none}

/* ===== Top app bar ===== */
.top-app-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:4px;height:64px;padding:0 4px 0 16px;
  background:var(--md-surface);transition:background .2s linear}
.top-app-bar.scrolled{background:var(--md-surface-container)}
.top-app-bar h1{flex:1;margin:0 0 0 4px}
.brand-mark{width:28px;height:28px;flex:none}
.icon-btn{width:48px;height:48px;border-radius:var(--shape-full);display:inline-grid;place-items:center;color:var(--md-on-surface-variant)}

/* ===== Layout ===== */
main{max-width:1180px;margin:0 auto;padding:4px 16px 112px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){main{grid-template-columns:minmax(0,7fr) minmax(0,5fr);padding:8px 24px 112px;align-items:start}
  .stage-col{position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}}
.stage-col,.detail-col{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ===== Stage ===== */
.stage{position:relative;background:var(--md-surface-container-low);border-radius:var(--shape-xl);overflow:hidden}
.stage svg.scene{display:block;width:100%;height:auto;max-height:62vh;margin:0 auto;aspect-ratio:1/1}
.floor-line{stroke:var(--md-outline-variant);stroke-width:2}
.shadow{fill:var(--md-on-surface);opacity:.08}
.towel{fill:none;stroke:var(--towel);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.surface{fill:none;stroke:var(--md-outline);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.surface.solid{fill:var(--md-surface-container-highest);stroke-width:3;opacity:1}
.thumb .ts{fill:none;stroke:var(--md-outline);stroke-width:5;stroke-linecap:round;opacity:.6}
.thumb .ts.solid{fill:var(--md-surface-container-highest);stroke-width:3;opacity:1}
.wall{stroke:var(--md-outline);stroke-width:6;opacity:.55}
.thumb .tt{fill:none;stroke:var(--towel);stroke-width:6;stroke-linecap:round}
.thumb .tw{stroke:var(--md-outline);stroke-width:5;opacity:.55}
.wt{fill:var(--weight);stroke:none}
.wt-hub{fill:var(--md-surface-container-low)}
.wt-bar{stroke:var(--weight);stroke-width:4;stroke-linecap:round}
.band{fill:none;stroke:var(--band);stroke-linecap:round;stroke-linejoin:round}
.thumb .tb{fill:none;stroke:var(--band);stroke-width:4;stroke-linecap:round}
.bone{stroke-width:10;stroke-linecap:round;fill:none}
/* limbs that can point toward the camera are drawn with non-scaling strokes (so foreshortening doesn't squash
   them); their width is set in screen pixels to match 10 units at the scene's current zoom */
.scene line.bone[vector-effect]{stroke-width:var(--limb-px,10px)}
.core .bone,.core.bone{stroke:var(--md-on-surface)}
.head{fill:var(--md-on-surface)}
.side-R .bone{stroke:var(--md-primary)}
.side-L .bone{stroke:var(--md-tertiary);opacity:.9}
.hand{stroke:none}
.side-R .hand{fill:var(--md-primary)}.side-L .hand{fill:var(--md-tertiary)}
/* the article's technique: every joint is a <g> pivoting at its own origin */
.scene g{transform-box:view-box;transform-origin:0 0}

.guide{position:absolute;top:12px;right:12px;width:112px;padding:8px 8px 6px;border-radius:var(--shape-l);
  background:color-mix(in srgb,var(--md-surface-container-lowest) 88%,transparent);text-align:center}
.guide svg{width:96px;height:96px;display:block;margin:0 auto}
.guide .arm{stroke:var(--md-outline-variant);stroke-width:5;stroke-linecap:round;opacity:1;transition:opacity .25s linear,stroke .25s linear}
.guide .arm.active{stroke:var(--md-primary);opacity:1}
.guide .tip{fill:var(--md-primary);transition:opacity .25s linear}
.guide .stance{fill:var(--md-on-surface)}
.guide .facing{fill:var(--md-on-surface-variant)}
.guide .body-small{display:block;min-height:16px;color:var(--md-on-surface-variant)}
.guide[hidden]{display:none}

.legend{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}

.caption{padding:4px 20px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.caption .step{grid-row:span 2;font-size:32px;line-height:40px;font-weight:500;color:var(--md-primary);font-variant-numeric:tabular-nums;min-width:2ch}
.caption .cue{color:var(--md-on-surface-variant);min-height:20px}

.progress{height:4px;background:var(--md-secondary-container);border-radius:2px;margin:0 20px 16px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--md-primary);border-radius:2px}

/* ===== Controls ===== */
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.play-btn{width:80px;height:80px;border-radius:var(--shape-xl);background:var(--md-primary-container);color:var(--md-on-primary-container);
  display:grid;place-items:center;box-shadow:var(--elev-3)}
.play-btn .icon{font-size:36px}
.controls .icon-btn{width:56px;height:56px;color:var(--md-on-surface)}
.controls-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.segmented{display:inline-flex;border:1px solid var(--md-outline);border-radius:var(--shape-full);overflow:hidden;height:40px}
.segmented button{display:inline-flex;align-items:center;gap:8px;padding:0 16px;min-width:48px;justify-content:center;color:var(--md-on-surface)}
.segmented button+button{border-left:1px solid var(--md-outline)}
.segmented button[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.segmented button .icon{font-size:18px;display:none}
.segmented button[aria-pressed="true"] .icon{display:inline-block}
.segmented[hidden]{display:none}

/* ===== Cards, chips, lists ===== */
.card{background:var(--md-surface-container);border-radius:var(--shape-m);padding:16px}
.card.outlined{background:var(--md-surface);border:1px solid var(--md-outline-variant)}
.card h2,.card h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border:1px solid var(--md-outline-variant);border-radius:var(--shape-s);
  color:var(--md-on-surface-variant);font-weight:500;letter-spacing:.1px;background:transparent}
.chip .icon{font-size:18px;margin-left:-8px;color:var(--md-primary)}
.source{display:inline-flex;align-items:center;gap:4px;color:var(--md-primary);text-decoration:none;font-weight:500}
.source:hover{text-decoration:underline}

.list{position:relative;list-style:none;margin:8px -16px -8px;padding:0;max-height:360px;overflow:auto}
.list li button{width:100%;display:grid;grid-template-columns:40px 1fr;gap:0 12px;align-items:center;text-align:left;padding:8px 16px;min-height:56px}
.list .num{width:32px;height:32px;border-radius:var(--shape-full);display:grid;place-items:center;font-weight:500;font-variant-numeric:tabular-nums;
  color:var(--md-on-surface-variant);background:var(--md-surface-container-highest)}
.list li button[aria-current="step"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.list li button[aria-current="step"] .num{background:var(--md-primary);color:var(--md-on-primary)}
.list .sub{grid-column:2;color:var(--md-on-surface-variant);font-size:12px;line-height:16px}
.list li button[aria-current="step"] .sub{color:inherit;opacity:.8}

.lib-item{display:flex;align-items:center;gap:4px;border-radius:var(--shape-l)}
.lib-item>button.pick{flex:1;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:var(--shape-l);min-height:56px}
.lib-item>button.pick[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.lib-item .icon-btn{width:40px;height:40px}

details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;margin:-16px;padding:16px;border-radius:var(--shape-m)}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .chev{margin-left:auto;transition:transform .2s var(--ease-emph);color:var(--md-on-surface-variant)}
details.card[open]>summary .chev{transform:rotate(180deg)}
details.card[open]>summary{margin-bottom:0}
details.card .body{padding-top:16px}
.body ul,.body ol{margin:4px 0 12px;padding-left:20px}
.body li{margin:4px 0}
.body p{margin:0 0 8px}
code{font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-size:12.5px;background:var(--md-surface-container-highest);padding:1px 5px;border-radius:4px}

/* ===== Sliders (pose editor) ===== */
.joint{display:grid;grid-template-columns:minmax(0,1fr) 44px 56px 44px 40px;align-items:center;gap:2px;min-height:44px}
.joint .jl{color:var(--md-on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.joint output{text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.joint .jbtn{width:44px;height:44px;background:var(--md-surface-container-high);color:var(--md-on-surface)}
.joint .jundo{width:40px;height:40px;color:var(--md-primary)}
.editor-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.step-text,.text-form{display:grid;gap:8px;margin:4px 0 10px}
.text-form{padding:4px 0 8px}
.text-edit{margin:0 0 12px;border-radius:var(--shape-m);background:var(--md-surface-container)}
.text-edit summary{display:flex;align-items:center;gap:10px;padding:10px 12px;list-style:none;cursor:pointer;border-radius:inherit}
.text-edit summary::-webkit-details-marker{display:none}
.text-edit summary .chev{margin-left:auto;transition:transform .2s}
.text-edit[open] summary .chev{transform:rotate(180deg)}
.text-edit .text-form{padding:4px 12px 12px}
.field textarea{resize:vertical;line-height:1.4}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--md-secondary-container)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--md-secondary-container)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--md-primary);margin-top:-8px;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--md-primary);border:0}
input[type=range]:disabled{opacity:.38}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:var(--shape-full);font-weight:500;letter-spacing:.1px}
.btn .icon{font-size:18px;margin-left:-8px}
.btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.text{padding:0 12px;color:var(--md-primary)}
.btn.outlined{border:1px solid var(--md-outline);color:var(--md-primary)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;height:56px;padding:0 20px 0 16px;border-radius:var(--shape-l);
  display:inline-flex;align-items:center;gap:12px;background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--elev-3);font-weight:500}

/* ===== Dialog, snackbar, drop overlay ===== */
dialog{border:0;padding:24px;border-radius:var(--shape-xl);background:var(--md-surface-container-high);color:var(--md-on-surface);
  width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px)}
dialog::backdrop{background:var(--md-scrim)}
dialog h2{margin:0 0 16px}
dialog textarea{width:100%;min-height:260px;resize:vertical;border-radius:var(--shape-s);border:1px solid var(--md-outline);padding:12px;
  background:var(--md-surface-container-highest);color:var(--md-on-surface);font:12.5px/1.5 ui-monospace,"Roboto Mono",Menlo,monospace}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.snackbar{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:40;
  min-height:48px;max-width:min(560px,calc(100vw - 32px));display:flex;align-items:center;padding:14px 16px;border-radius:4px;
  background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);box-shadow:var(--elev-3);transition:transform .25s var(--ease-emph),opacity .2s linear}
.snackbar.show{transform:translate(-50%,0);opacity:1}
.drop{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:color-mix(in srgb,var(--md-primary-container) 85%,transparent);
  color:var(--md-on-primary-container)}
.drop.show{display:grid}
.drop div{border:3px dashed currentColor;border-radius:var(--shape-xl);padding:48px 56px;text-align:center}
.drop .icon{font-size:48px}
.empty{padding:56px 24px;text-align:center}
.empty .icon{font-size:48px;color:var(--md-primary)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Pose library ===== */
.thumb{display:block;width:100%;height:auto;aspect-ratio:1/1}
.thumb line{stroke-linecap:round;stroke-width:10}
.thumb .tL{stroke:var(--md-tertiary)}.thumb .tR{stroke:var(--md-primary)}.thumb .tc{stroke:var(--md-on-surface)}
.thumb .th{fill:var(--md-on-surface)}.thumb .tf{stroke:var(--md-outline-variant);stroke-width:3}
dialog.library{padding:0;width:min(1000px,calc(100vw - 48px));height:min(860px,calc(100dvh - 48px));max-height:none;max-width:none;overflow:hidden}
dialog.library[open]{display:flex;flex-direction:column}
@media (max-width:600px){dialog.library{width:100vw;height:100dvh;border-radius:0;margin:0;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.lib-head{display:flex;align-items:center;gap:4px;padding:8px 12px 0 4px}
.lib-head h2{flex:1;margin:0}
.lib-tools{padding:8px 16px 4px}
.ai-body{flex:1;overflow:auto;padding:4px 24px 24px}
.ai-body>p{margin:0 0 4px}
.ai-step{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.ai-num{width:24px;height:24px;flex:none;border-radius:var(--shape-full);display:grid;place-items:center;background:var(--md-primary);color:var(--md-on-primary);font-size:12px}
.ai-dialog .field{max-width:none;margin:0 0 4px}
.ai-dialog .chips{margin:0 0 12px}
.ai-dialog .filter{height:auto;min-height:32px}
.ai-dialog textarea#aiAnswer{min-height:120px;margin:0 0 8px}
.ai-dialog textarea#aiInput{min-height:0;resize:vertical;font:inherit;font-size:16px}
.ai-dialog .row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-height:520px){.ai-body{padding-bottom:22vh}}
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:var(--shape-full);background:var(--md-surface-container-highest);color:var(--md-on-surface-variant)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--md-on-surface);outline:none}
.search:focus-within{outline:3px solid var(--md-primary);outline-offset:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters+.filters{padding-top:0}
.filter{flex:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border-radius:var(--shape-s);border:1px solid var(--md-outline-variant);
  color:var(--md-on-surface-variant);font-weight:500;letter-spacing:.1px}
.filter[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-color:transparent;padding-left:8px}
.filter .icon{font-size:18px;display:none}
.filter[aria-pressed="true"] .icon{display:inline-block}
.lib-count{padding:0 16px 8px}
.pose-grid{flex:1;overflow:auto;padding:4px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.pose-card{display:flex;flex-direction:column;text-align:left;border-radius:var(--shape-m);background:var(--md-surface-container-low);padding:0 0 12px}
.pose-card .thumb{flex:none;width:100%;height:auto;background:var(--md-surface-container);border-radius:var(--shape-m) var(--shape-m) 0 0}
.pose-card .t{padding:10px 12px 0}
.pose-card .sk{padding:0 12px;font-style:italic}
.pose-card[aria-current="true"]{outline:2px solid var(--md-primary);outline-offset:-2px}
.pose-grid .none{grid-column:1/-1;padding:48px 16px;text-align:center}
.subtitle{font-style:italic;margin:2px 0 0}

[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* ===================== App shell (Explore / Saved / Create + Player) ===================== */
.shell{min-height:100%}
.main{min-width:0}
.rail{display:none}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;background:var(--md-surface-container)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--md-on-surface-variant);
  -webkit-tap-highlight-color:transparent}
.nav-item .pill{width:64px;height:32px;border-radius:var(--shape-full);display:grid;place-items:center;position:relative;overflow:hidden;transition:background .2s var(--ease-emph)}
.nav-item .pill::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s linear}
.nav-item:hover .pill::before{opacity:.08}
.nav-item .label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.nav-item[aria-current="page"]{color:var(--md-on-surface)}
.nav-item[aria-current="page"] .pill{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.nav-item[aria-current="page"] .icon{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
body[data-view="player"] .navbar{display:none}
@media (min-width:840px){
  .shell{display:grid;grid-template-columns:88px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:0;height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 0 20px;
    background:var(--md-surface)}
  .rail .brand-mark{margin-bottom:24px}
  .rail-items{display:flex;flex-direction:column;gap:12px;flex:1}
  .rail .nav-item{flex:none;width:80px;min-height:56px}
  .rail .pill{width:56px}
  .navbar,.bar-brand{display:none!important}
}
.top-app-bar{padding:0 4px 0 12px}
.top-app-bar h1{margin:0 0 0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{max-width:1240px;margin:0 auto;padding:4px 16px calc(104px + env(safe-area-inset-bottom,0px))}
body[data-view="player"] .view{padding-bottom:32px}
@media (min-width:840px){.view{padding:8px 24px 40px}}
.view[hidden]{display:none}
.body-medium{font-size:14px;line-height:20px;letter-spacing:.25px}
.label-medium{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}

/* Explore */
.explore-head{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.explore-head .filters{padding:8px 0 0}
.search .icon-btn{width:40px;height:40px;margin-right:-8px}
.section{margin:20px 0 8px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.section-head h2{margin:0}
.section-head .count{color:var(--md-on-surface-variant);font-weight:400;margin-left:6px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:148px;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.carousel>*{scroll-snap-align:start}
@media (min-width:840px){.carousel{grid-auto-columns:168px}}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;margin-top:12px}
.pose-card .meta{padding:2px 12px 0;color:var(--md-on-surface-variant)}
.pose-card{position:relative}
.pose-card .badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:var(--shape-full);display:grid;place-items:center;
  background:var(--md-primary-container);color:var(--md-on-primary-container)}
.pose-card .badge .icon{font-size:16px}
.empty-state{padding:48px 16px;text-align:center}
.empty-state .icon{font-size:48px;color:var(--md-primary)}

/* Saved */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
.item-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:4px;border-radius:var(--shape-l);background:var(--md-surface-container-low)}
.item>.open{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 8px;text-align:left;border-radius:var(--shape-l)}
.item .thumb{width:64px;height:64px;flex:none;border-radius:var(--shape-m);background:var(--md-surface-container)}
.item .txt{min-width:0}
.item .txt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .icon-btn{margin-right:4px}

/* Create */
.create-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:4px 0 12px}
.create-grid .card{display:flex;flex-direction:column;gap:8px;background:var(--md-surface-container-low)}
.create-grid .card p{margin:0 0 8px;flex:1}
.create-grid h2{margin:4px 0 0}
.icon.big{font-size:32px;color:var(--md-primary)}
.format-card{margin-top:4px}

/* Player */
.player{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:840px){.player{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
  .player .stage-col{position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage .legend{top:auto;bottom:12px;left:16px;flex-direction:row;gap:12px;color:var(--md-on-surface-variant)}
.stage-chips{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}
.stage-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:var(--shape-s);
  background:color-mix(in srgb,var(--md-surface-container-highest) 90%,transparent);color:var(--md-on-surface);font-weight:500;font-variant-numeric:tabular-nums}
.stage-chip .icon{font-size:18px;color:var(--md-primary)}
.stage-chip[hidden]{display:none}
#holdChip{background:var(--md-primary-container);color:var(--md-on-primary-container)}
#holdChip .icon{color:inherit}
.now{display:flex;gap:14px;align-items:flex-start;padding:4px 4px 0}
.now .step{font-size:32px;line-height:36px;font-weight:500;color:var(--md-primary);font-variant-numeric:tabular-nums;min-width:2ch}
.now h2{margin:2px 0 2px}
.now .cue{margin:0;color:var(--md-on-surface-variant);min-height:20px}
.stage-col .progress{margin:0 4px}
.info-col{min-width:0}
.ex-head{padding:4px 4px 8px}
.ex-head .overline{margin:0 0 4px;color:var(--md-primary);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.ex-head h2{margin:0}
.ex-head .subtitle:empty{display:none}
.ex-head .chips{margin:12px 0 4px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:11px;line-height:16px;font-weight:500;background:var(--md-surface-container-highest);color:var(--md-on-surface-variant)}
.actions.actions-top{margin:4px 0 16px;justify-content:flex-start;flex-direction:row-reverse}
.note{padding:12px 14px;border-radius:var(--shape-m);background:var(--md-surface-container);display:flex;gap:10px}
.note .icon{color:var(--md-primary);font-size:20px}

/* ===================== Workouts ===================== */
.wk-list{display:flex;flex-direction:column;gap:8px;max-width:760px}
.wk-card{position:relative;border-radius:var(--shape-m);overflow:hidden;text-align:left}
.wk-face{position:relative;display:flex;flex-direction:column;background:var(--md-surface-container-low);border-radius:inherit;
  transition:transform .2s var(--ease-emph);touch-action:pan-y}
.wk-card.swiping .wk-face,.wk-card.dragging .wk-face{transition:none}
.wk-card.dragging{box-shadow:var(--elev-3);z-index:2}
.wk-del{position:absolute;right:0;top:0;bottom:0;width:96px;padding-left:8px;display:grid;place-items:center;background:var(--md-error);color:#fff}
.wk-del .icon{font-size:28px}
.wk-card:not(.swiping):not(.swiped) .wk-del{visibility:hidden}
.wk-row{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 2px;min-height:64px}
.wk-row .handle{width:36px;height:48px;display:grid;place-items:center;color:var(--md-on-surface-variant);cursor:grab;touch-action:none;flex:none}
.wk-start{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--md-primary);color:var(--md-on-primary)}
.wk-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 4px 0 10px;text-align:left;border-radius:var(--shape-s)}
.wk-title .title-medium{flex:1;min-width:0}
.wk-title .icon{color:var(--md-on-surface-variant);transition:transform .2s}
.wk-card.open .wk-title .icon{transform:rotate(180deg)}
.wk-details{display:flex;flex-direction:column;gap:8px;padding:0 16px 14px 50px}
.wk-details[hidden]{display:none}
.wk-details .row{margin-top:4px}
.wk-details .wk-share{margin-left:auto}
.wk-add{margin-top:12px}
.wk-safety{margin:0}
.wk-summary .wk-safety{flex-basis:100%}
.wk-meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--md-on-surface-variant)}
.wk-meta span{display:inline-flex;align-items:center;gap:6px}
.wk-meta .icon{font-size:18px}
.resume{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;margin:4px 0 12px;border-radius:var(--shape-m);background:var(--md-primary-container);color:var(--md-on-primary-container)}
.resume .txt{flex:1;min-width:0}
.wk-head{display:flex;flex-direction:column;gap:12px;margin:4px 0 16px}
.field{display:flex;flex-direction:column;gap:4px;max-width:560px}
.field-label{font-size:12px;line-height:16px;font-weight:500;color:var(--md-primary);letter-spacing:.4px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--md-on-surface);background:var(--md-surface-container-highest);border:0;border-bottom:1px solid var(--md-on-surface-variant);
  border-radius:4px 4px 0 0;padding:12px 14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-bottom:2px solid var(--md-primary)}
.setting .select{font:inherit;font-size:16px;color:var(--md-on-surface);background:var(--md-surface-container-highest);border:0;border-bottom:1px solid var(--md-on-surface-variant);
  border-radius:4px 4px 0 0;padding:10px 12px;min-height:48px;flex:none}
.setting .select:focus-visible{outline:none;border-bottom:2px solid var(--md-primary)}
.wk-summary{display:flex;flex-wrap:wrap;gap:8px}
.block{margin:0 0 20px}
.block-head{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--md-outline-variant);padding:4px 0}
.block-head input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:500;color:var(--md-on-surface);background:transparent;border:0;border-radius:4px;padding:8px 6px;outline:none}
.block-head input:focus{background:var(--md-surface-container-highest)}
.block-head .count{color:var(--md-on-surface-variant);font-size:12px;white-space:nowrap}
.items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;min-height:8px}
.wi{display:flex;align-items:center;gap:4px;border-radius:var(--shape-m);background:var(--md-surface-container-low)}
.wi.dragging{opacity:.9;box-shadow:var(--elev-3);background:var(--md-surface-container-high);position:relative;z-index:5}
.wi .handle{width:40px;height:56px;display:grid;place-items:center;color:var(--md-on-surface-variant);cursor:grab;touch-action:none;flex:none}
.wi .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:6px 4px;text-align:left;border-radius:var(--shape-m)}
.wi .thumb{width:48px;height:48px;flex:none;border-radius:var(--shape-s);background:var(--md-surface-container)}
.wi .txt{min-width:0}
.wi .txt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block .add-row{margin-top:8px}
.menu{position:fixed;z-index:60;min-width:180px;padding:8px 0;border-radius:4px;background:var(--md-surface-container);box-shadow:var(--elev-3)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;text-align:left}
.menu button .icon{font-size:20px;color:var(--md-on-surface-variant)}
.danger{color:var(--md-error)!important}
.form-row{margin:0 0 16px}
.form-row>label,.form-row>.lbl{display:block;font-size:12px;line-height:16px;font-weight:500;color:var(--md-on-surface-variant);margin-bottom:6px}
.form-row .segmented{display:flex;width:100%;height:auto;min-height:40px}
.form-row .segmented button{flex:1 1 auto;min-width:0;padding:6px 8px;white-space:normal;line-height:1.2;text-align:center}   /* long side names wrap instead of running off the edge */
.form-row .segmented button .icon{display:none}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper output{min-width:56px;text-align:center;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stepper .icon-btn{width:40px;height:40px;border:1px solid var(--md-outline-variant)}
.stepper .num-field{width:72px;height:40px;text-align:center;font:inherit;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--md-on-surface);
  background:var(--md-surface-container-highest);border:0;border-bottom:1px solid var(--md-on-surface-variant);border-radius:4px 4px 0 0;-moz-appearance:textfield}
.stepper .num-field::-webkit-inner-spin-button,.stepper .num-field::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper .unit{margin-left:2px;color:var(--md-on-surface-variant)}
.stepper .num-field:focus-visible{outline:none;border-bottom:2px solid var(--md-primary)}
.pick-list{list-style:none;margin:0;padding:4px 8px 24px;overflow:auto;flex:1}
.pick-list li label{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:var(--shape-m);cursor:pointer}
.pick-list li label:hover{background:var(--md-surface-container-high)}
.pick-list input{width:20px;height:20px;accent-color:var(--md-primary)}
.pick-list .thumb{width:44px;height:44px;border-radius:var(--shape-s);background:var(--md-surface-container)}
.pick-list .txt span{display:block}
#pickDialog .lib-head .btn{margin-right:8px}
/* ===== exercise player: controls over the figure, details in a pull-up panel ===== */
.stage-wrap{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ex-controls{position:absolute;inset:0;border-radius:var(--shape-xl);display:flex;align-items:center;justify-content:center;gap:clamp(16px,6vw,40px);
  background:color-mix(in srgb,var(--md-scrim) 70%,transparent);opacity:0;pointer-events:none;transition:opacity .2s linear}
.ex-controls.show{opacity:1;pointer-events:auto}
.ex-cbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--md-on-surface);
  background:color-mix(in srgb,var(--md-surface-container-highest) 90%,transparent);position:relative;overflow:hidden}
.ex-cbtn .icon{font-size:30px}
.editor-steps{display:flex;align-items:center;gap:0;margin-left:auto}
.ex-play{width:84px;height:84px;background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--elev-3)}
.ex-play .icon{font-size:44px}
.ex-head .overline,.ex-head .headline-small,.ex-head .subtitle{display:block}
.panel{padding:4px 4px 8px}
.panel h3{margin:12px 0 6px}
.panel ol,.panel ul{margin:4px 0 12px;padding-left:20px}
.panel li{margin:4px 0}
.panel p{margin:0 0 10px}
.panel .list{margin:0 -4px;padding:0;max-height:none}
.ex-head{padding:4px 4px 0}
.ex-head .overline,.ex-head .headline-small,.ex-head .subtitle{display:block}
@media (max-width:839.98px){.ex-head .headline-small{display:none}}   /* the name is in the top bar already */
.ex-time{display:flex;align-items:center;gap:8px;margin:4px 4px 0;color:var(--md-on-surface-variant)}
.ex-time .icon{font-size:20px;color:var(--md-primary)}
.panel .chips{margin:8px 0 4px}
.steps-panel{padding:0}
.steps-panel summary{display:flex;align-items:center;gap:8px;padding:10px 4px;list-style:none;cursor:pointer;border-radius:var(--shape-s)}
.steps-panel summary::-webkit-details-marker{display:none}
.steps-panel summary .chev{margin-left:auto;transition:transform .2s}
.steps-panel[open] summary .chev{transform:rotate(180deg)}
.edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.edit-head h3{margin:0}
.controls-row .ctl{display:flex;flex-direction:column;gap:4px}
.controls-row .ctl[hidden]{display:none}
.ctl-label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.4px;color:var(--md-on-surface-variant);margin-left:4px}
.controls-row{align-items:flex-end}
/* editing on a narrow screen: the figure stays pinned at the top, smaller, while the controls scroll under it */
@media (max-width:839.98px){
  body.ex-editing .player .stage-col{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:5;background:var(--md-surface);padding-bottom:6px}
  body.ex-editing .stage-col > :not(.stage-wrap){display:none}
  body.ex-editing .stage svg.scene{max-height:34vh}
}

/* ===== settings ===== */
.settings-group{margin:4px 0 24px}
.settings-title{color:var(--md-primary);margin:8px 0 8px 4px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 16px;margin-bottom:8px;flex-wrap:wrap;
  background:var(--md-surface-container-low);border-radius:var(--shape-l)}
.setting .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
label.setting{cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;flex:none;margin:0;width:52px;height:32px;border-radius:16px;position:relative;cursor:pointer;
  background:var(--md-surface-container-highest);border:2px solid var(--md-outline);transition:background .2s,border-color .2s}
.switch::before{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--md-outline);
  transform:translateY(-50%);transition:all .2s var(--ease-emph)}
.switch:checked{background:var(--md-primary);border-color:var(--md-primary)}
.switch:checked::before{left:22px;width:24px;height:24px;background:var(--md-on-primary)}
.settings-group .create-grid{margin-top:0}
body:not(.authoring) .authoring-only{display:none!important}   /* tools for making exercises: JSON views, exporters */
.share-qr{display:grid;place-items:center;margin:0 0 12px}
.share-qr svg{width:min(240px,70vw);height:auto;background:#fff;border-radius:8px}
.share-qr p{margin:0}
.share-actions{flex-wrap:wrap}
#shareUrl{font-size:13px}
#linkBody ul{margin:4px 0 8px;padding-left:20px}
.settings-group .card h3{margin:4px 0 0}

/* ===== workout player: full screen, floor-readable, gestures ===== */
body[data-view="wplay"] .top-app-bar, body[data-view="wplay"] .rail, body[data-view="wplay"] .navbar{display:none!important}
body[data-view="wplay"] .shell{display:block}
body[data-view="wplay"] .view{padding:0!important;max-width:none}
body[data-view="wplay"]{overflow:hidden;background:var(--md-surface)}
/* the player follows the theme: light by default, dark with the dark theme (below). High contrast either way,
   to read from the floor; the side colours stay teal (right) and orange (left). */
.fs{position:fixed;inset:0;background:var(--wp-bg);color:var(--wp-fg);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;
