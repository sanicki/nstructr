name: Browser tests (all)
# Every browser test (tools/e2e/run.py --all), each night and by hand (Actions → Browser tests (all) → Run workflow).
# Pull requests run the quick set in build.yml. A failing test's output is uploaded as an artifact.
on:
  schedule: [{ cron: '17 6 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: tools/e2e/requirements.txt }
      - run: npm ci
      - run: node tools/build.mjs --no-checks
      - run: pip install -r tools/e2e/requirements.txt && python -m playwright install --with-deps chromium
      - run: python tools/e2e/run.py --all --jobs 4 --timeout 600
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-output, path: e2e-output/ }
