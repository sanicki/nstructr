name: Build and deploy
# Pull requests: validate every library file and run the animation checks.
# Pushes to main: the same, then publish _site/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# a pull request's run only replaces an older run of the same pull request; deploys from main queue, never cancelled
# (sharing one group, a pull request's run cancelled a merge's deploy, Sep 2026)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node tools/build.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  # the browser tests that matter most (tools/e2e/run.py FAST, a few minutes): each fails on a ✗ check, a page error
  # or a crash; their output is uploaded when one fails. Every test runs nightly (e2e-nightly.yml).
  browser-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: tools/e2e/requirements.txt }
      - run: npm ci
      - run: node tools/build.mjs --no-checks
      - run: pip install -r tools/e2e/requirements.txt && python -m playwright install --with-deps chromium
      - run: python tools/e2e/run.py --jobs 4
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-output, path: e2e-output/ }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
