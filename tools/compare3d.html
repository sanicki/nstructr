<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D skeleton comparison</title>
<!-- Developer page for the 3D skeleton (docs/3d-skeleton.md). Serve the repository root and open this file:
       python3 -m http.server 8000     then  http://127.0.0.1:8000/tools/compare3d.html
     Left: today's 2D figure. Right: the same poses as a 3D figure, drawn far to near, from a camera you can turn. -->
<style>
  :root{--bg:#f8f9ff;--fg:#191c20;--muted:#43474e;--line:#c3c6cf;--L:#6b5778;--R:#36618e;--body:#191c20;--panel:#eef0f7}
  @media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e1e2e8;--muted:#c3c6cf;--line:#43474e;--L:#d7bee4;--R:#a0cafd;--body:#e1e2e8;--panel:#1d2024}}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:12px 16px 32px}
  h1{font-size:20px;margin:8px 0}
  .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0}
  label{display:flex;gap:6px;align-items:center}
  select,button,input{font:inherit}
  button{min-height:40px;padding:0 14px}
  .panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  figure{margin:0;background:var(--panel);border-radius:16px;padding:8px}
  figcaption{color:var(--muted);font-size:13px;padding:0 4px 4px}
  svg{width:100%;height:auto;display:block}
  .bone{stroke-width:10;stroke-linecap:round;fill:none}
  .L{stroke:var(--L)} .R{stroke:var(--R)} .B{stroke:var(--body)}
  .floor{stroke:var(--line);stroke-width:2}
  .note{color:var(--muted);font-size:13px}
  #step{min-width:220px}
</style>
</head>
<body>
<main>
  <h1>3D skeleton: today vs 3D</h1>
  <p class="note">The 3D figure is built from today's poses (step 1 of docs/3d-skeleton.md). From each step's own view it
    matches exactly; turn the camera to see the same body from anywhere. Parts are drawn far to near by their depth, so
    no "layers" setting is used on the right.</p>
  <div class="bar">
    <label>Exercise <select id="ex"></select></label>
    <label>Side <select id="side"><option value="L">first</option><option value="R">second</option></select></label>
    <label>Direction <select id="dir"><option value="A">A</option><option value="B">B</option></select></label>
    <button id="play">Pause</button>
  </div>
  <div class="bar">
    <label>Step <input type="range" id="step" min="0" max="0" value="0"> <span id="stepName"></span></label>
  </div>
  <div class="bar">
    <label><input type="checkbox" id="follow" checked> Camera follows each step's view</label>
    <label>Camera <input type="range" id="yaw" min="-180" max="180" value="90"> <span id="yawText"></span></label>
  </div>
  <div class="panes">
    <figure><figcaption>Today: 2D, leg order from "layers"</figcaption><svg id="v1" viewBox="0 0 400 400"></svg></figure>
    <figure><figcaption>3D, drawn far to near</figcaption><svg id="v3" viewBox="0 0 400 400"></svg></figure>
  </div>
</main>
<script src="../src/core.js"></script>
<script src="../src/skeleton3d.js"></script>
<script>
const $ = s => document.querySelector(s), seg = DEFAULT_SEGMENTS;
let LIB = [], R = [], KF = [], i = 0, t = 0, playing = true, last = 0;
const bones2 = { legL: [['hipL','kneeL'],['kneeL','ankleL'],['ankleL','toeL']], legR: [['hipR','kneeR'],['kneeR','ankleR'],['ankleR','toeR']],
  armL: [['shoulderL','elbowL'],['elbowL','handL']], armR: [['shoulderR','elbowR'],['elbowR','handR']], body: [['pelvis','spine'],['spine','neckBase'],['neckBase','head']] };
const cls = part => (part.endsWith('L') ? 'L' : part.endsWith('R') ? 'R' : 'B');
function lines(P, parts, ox = 0, oy = 0) {
  let s = '';
  for (const part of parts) for (const [a, b] of bones2[part]) s += `<line class="bone ${cls(part)}" x1="${(P[a].x + ox).toFixed(1)}" y1="${(P[a].y + oy).toFixed(1)}" x2="${(P[b].x + ox).toFixed(1)}" y2="${(P[b].y + oy).toFixed(1)}"/>`;
  return s;
}
const head = (P, ox = 0, oy = 0) => `<circle cx="${(P.head.x + ox).toFixed(1)}" cy="${(P.head.y + oy).toFixed(1)}" r="${seg.head}" fill="var(--body)"/>`;
/* the 3D figure between two steps: each bone's direction turns (slerp), so limbs keep their length */
const TREE = [['pelvis','spine'],['spine','neckBase'],['neckBase','head'],['spine','shoulderL'],['spine','shoulderR'],['shoulderL','elbowL'],['elbowL','handL'],
  ['shoulderR','elbowR'],['elbowR','handR'],['pelvis','hipL'],['pelvis','hipR'],['hipL','kneeL'],['kneeL','ankleL'],['ankleL','toeL'],['hipR','kneeR'],['kneeR','ankleR'],['ankleR','toeR']];
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }), len = v => Math.hypot(v.x, v.y, v.z);
function slerpDir(u, v, e) {
  const lu = len(u) || 1, lv = len(v) || 1, a = { x: u.x / lu, y: u.y / lu, z: u.z / lu }, b = { x: v.x / lv, y: v.y / lv, z: v.z / lv };
  const dot = Math.max(-1, Math.min(1, a.x * b.x + a.y * b.y + a.z * b.z)), th = Math.acos(dot), L = lu + (lv - lu) * e;
  if (th < 1e-4) return { x: a.x * L, y: a.y * L, z: a.z * L };
  const s = Math.sin(th), wa = Math.sin((1 - e) * th) / s, wb = Math.sin(e * th) / s;
  return { x: (a.x * wa + b.x * wb) * L, y: (a.y * wa + b.y * wb) * L, z: (a.z * wa + b.z * wb) * L };
}
function between3(A, B, e) {
  const P = { pelvis: { x: 0, y: 0, z: 0 } };
  for (const [p, c] of TREE) { const d = slerpDir(sub(A[c], A[p]), sub(B[c], B[p]), e); P[c] = { x: P[p].x + d.x, y: P[p].y + d.y, z: P[p].z + d.z }; }
  return P;
}
/* where the pelvis is in the world: height above the floor, and the step's sideways shift in its own view */
function world(r) {
  const pos = frameAt(r, r, 1, seg).pos, dx = pos.x - CX;
  return { y: FLOOR - pos.y, x: r.v >= 0.5 ? -dx : 0, z: r.v >= 0.5 ? 0 : dx };
}
function load() {
  const ex = LIB.find(x => x.id === $('#ex').value); if (!ex) return;
  $('#side').disabled = !ex.bilateral; $('#dir').disabled = !ex.direction;
  const side = ex.bilateral ? $('#side').value : 'L', dir = ex.direction ? $('#dir').value : 'A';
  let kfs = ex.keyframes;
  if (dir === 'B') kfs = reverseReps(kfs);
  if (side === 'R') kfs = kfs.map(mirrorKeyframe);
  KF = kfs; R = resolveSequence(kfs, seg, ex, side === 'R' ? mirrorProps(ex.props) : ex.props);
  R.forEach(r => { r.p3 = S3D.pose3d(r.pose, r.v, seg); r.w = world(r); });
  $('#step').max = R.length - 1; i = 0; t = 0; draw();
}
function draw() {
  if (!R.length) return;
  const b = R[i], a = R[(i - 1 + R.length) % R.length], raw = b.dur ? Math.min(1, t / b.dur) : 1;
  const e = b.ease === 'linear' ? raw : (raw < 0.5 ? 4 * raw ** 3 : 1 - (-2 * raw + 2) ** 3 / 2);
  // today
  const f = frameAt(a, b, e, seg), P = fk(f.pose, f.v, seg, f.pos.x, f.pos.y);
  const lay = s => (b.layers && b.layers['leg' + s]) || (s === 'L' ? 'back' : 'front');
  const order = ['L', 'R'].filter(s => lay(s) === 'back').map(s => 'leg' + s).concat(['armL', 'body', 'armR'], ['L', 'R'].filter(s => lay(s) !== 'back').map(s => 'leg' + s));
  $('#v1').innerHTML = `<line class="floor" x1="0" y1="${FLOOR}" x2="400" y2="${FLOOR}"/>` + lines(P, order) + head(P);
  // 3D
  const v = a.v + (b.v - a.v) * e, yaw = $('#follow').checked ? 90 * (1 - v) : +$('#yaw').value;
  if ($('#follow').checked) $('#yaw').value = Math.round(yaw);
  $('#yawText').textContent = `${Math.round(yaw)}° ${Math.abs(yaw - 90) < 1 ? '(side)' : Math.abs(yaw) < 1 ? '(front)' : ''}`;
  const P3 = between3(a.p3, b.p3, e), W = { x: a.w.x + (b.w.x - a.w.x) * e, y: a.w.y + (b.w.y - a.w.y) * e, z: a.w.z + (b.w.z - a.w.z) * e };
  const Q = S3D.project(P3, yaw), O = S3D.project({ o: W }, yaw).o;
  $('#v3').innerHTML = `<line class="floor" x1="0" y1="${FLOOR}" x2="400" y2="${FLOOR}"/>` + lines(Q, S3D.drawOrder(Q), CX + O.x, FLOOR + O.y) + head(Q, CX + O.x, FLOOR + O.y);
  $('#step').value = i; $('#stepName').textContent = `${i + 1}/${R.length} ${b.name}${b.quiet ? ' (quiet)' : ''}`;
}
function frame(ts) {
  const dt = last ? Math.min(100, ts - last) : 0; last = ts;
  if (playing && R.length) {
    t += dt;
    while (t >= R[i].dur + R[i].hold) { t -= R[i].dur + R[i].hold; i = (i + 1) % R.length; }
  }
  draw(); requestAnimationFrame(frame);
}
fetch('../library/index.json').then(r => r.json()).then(d => {
  LIB = d.exercises.sort((a, b) => a.name.localeCompare(b.name));
  $('#ex').innerHTML = LIB.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  const want = new URLSearchParams(location.search).get('ex'); if (want) $('#ex').value = want;
  load(); requestAnimationFrame(frame);
});
['#ex', '#side', '#dir'].forEach(s => $(s).addEventListener('change', load));
$('#play').addEventListener('click', () => { playing = !playing; $('#play').textContent = playing ? 'Pause' : 'Play'; });
$('#step').addEventListener('input', e => { i = +e.target.value; t = R[i].dur; playing = false; $('#play').textContent = 'Play'; draw(); });
$('#yaw').addEventListener('input', () => { $('#follow').checked = false; draw(); });
</script>
</body>
</html>
